version: "3.7"

services:
  blog-service:
    build:
      context: ./Blog
      dockerfile: Dockerfile
    image: blog-app-image
    container_name: blog-app-container
    restart: always
    networks:
      - app-network
    ports:
      - "8082:8082"
    depends_on:
      - database
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=super
      - DB_NAME=blog-service

  stakeholders-service:
    build:
      context: ./Stakeholder/src  # folder u kojem je .NET projekat
      dockerfile: Dockerfile
    image: stakeholders-app-image
    container_name: stakeholders-app-container
    restart: always
    networks:
      - app-network
    ports:
      - "8080:80"
    depends_on:
      - database
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=stakeholders;Username=postgres;Password=super

  database:
    image: postgres:17
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
      POSTGRES_DB: blog-service   # inicijalna baza, ali možeš praviti više
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
