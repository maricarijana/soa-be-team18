version: "3.7"

services:
  blog-service:
    build:
      context: ./ # podrazumeva da je Dockerfile u ovom folderu
      dockerfile: Dockerfile
    image: blog-app-image
    container_name: blog-app-container
    restart: always
    networks:
      - blog-network
    ports:
      - "8082:8082"
    depends_on:
      - database

  database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
      POSTGRES_DB: blog-service
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - blog-network

volumes:
  blog-db-data:

networks:
  blog-network:
