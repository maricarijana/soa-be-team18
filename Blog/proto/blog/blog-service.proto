syntax = "proto3";
option go_package = "proto/blog";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

enum BlogStatus {
  DRAFT = 0;
  PUBLISHED = 1;
  CLOSED = 2;
  ACTIVE = 3;
  FAMOUS = 4;
}

message Blog {
  string id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  string image_url = 5;
  BlogStatus status = 6;
  int64 user_id = 7;
  int32 rating_sum = 8;
  repeated Rating ratings = 9;
  repeated Comment comments = 10;
}

message Rating {
  int64 user_id = 1;
  int32 value = 2;
  google.protobuf.Timestamp created_at = 3;
}

message Comment {
  string id = 1;
  string blog_id = 2;
  string author = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateBlogRequest {
  string title = 1;
  string description = 2;
  string image_url = 3;
  BlogStatus status = 4;
  int64 user_id = 5;
}
message CreateBlogResponse {
  Blog blog = 1;
}

message LikeBlogRequest {
  string blog_id = 1;
  int64 user_id = 2;
}
message LikeBlogResponse { string message = 1; } 

message CreateCommentRequest {
  string blog_id = 1;
  string author = 2;
  string text = 3;
}
message CreateCommentResponse {
  Comment comment = 1;
}

message GetBlogsRequest {}
message GetBlogsResponse {
  repeated Blog blogs = 1;
}

message GetBlogByIdRequest {
  string blog_id = 1;
}

message GetBlogByIdResponse {
  Blog blog = 1;
}

service BlogService {
  rpc CreateBlog (CreateBlogRequest) returns (CreateBlogResponse) {
    option (google.api.http) = {
      post: "/api/blog"
      body: "*"
    };
  }
  rpc LikeBlog (LikeBlogRequest) returns (Blog) {
    option (google.api.http) = {
      post: "/api/blog/{blog_id}/like"
      body: "*"
    };
  }
  rpc CreateComment (CreateCommentRequest) returns (CreateCommentResponse) {
    option (google.api.http) = {
      post: "/api/blog/{blog_id}/comments"
      body: "*"
    };
  }
  
  rpc GetBlogs (GetBlogsRequest) returns (GetBlogsResponse) {
    option (google.api.http) = {
      get: "/api/blogs"
    };
  }

  rpc GetBlogById (GetBlogByIdRequest) returns (GetBlogByIdResponse) {
  option (google.api.http) = {
    get: "/api/blog/{blog_id}"
  };
}

}
