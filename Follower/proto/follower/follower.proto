syntax = "proto3";

package follower;
option go_package = "soa/follower/proto/follower;follower";

service FollowerService {
  rpc FollowUser (FollowRequest) returns (FollowResponse);
  rpc UnfollowUser (FollowRequest) returns (FollowResponse);
  rpc GetFollowing (UserRequest) returns (UserListResponse);
  rpc GetFollowers (UserRequest) returns (UserListResponse);
  rpc GetRecommendations (UserRequest) returns (UserListResponse);
}

message FollowRequest {
  int64 follower_id = 1;
  int64 followee_id = 2;
}

message FollowResponse {
  string message = 1;
}

message UserRequest {
  int64 user_id = 1;
}

message UserListResponse {
  repeated int64 user_ids = 1;
}
