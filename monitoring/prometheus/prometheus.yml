global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9099']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
      
  - job_name: 'docker-stats-exporter'
    static_configs:
      - targets: ['docker-stats-exporter:9487']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']