syntax = "proto3";

option go_package = "proto/tours";
option csharp_namespace = "GrpcServiceTranscoding";

import "google/api/annotations.proto";

package tours;

// =================== Tours Service ===================
service ToursService {
  // Dodavanje ture
  rpc AddTour (AddTourRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/tours"
      body: "*"
    };
  }

  rpc GetToursByUser (GetToursByUserRequest) returns (GetToursByUserResponse) {
    option (google.api.http) = {
      get: "/api/tours/user/{userId}"
    };
  }
}

// =================== KeyPoint Service ===================
service KeyPointService {
  rpc AddKeyPoint (AddKeyPointRequest) returns (KeyPoint) {
    option (google.api.http) = {
      post: "/api/keypoints"
      body: "*"
    };
  }

  rpc UpdateKeyPoint (KeyPoint) returns (KeyPoint) {
    option (google.api.http) = {
      put: "/api/keypoints/{id}"
      body: "*"
    };
  }

  rpc DeleteKeyPoint (DeleteKeyPointRequest) returns (DeleteKeyPointResponse) {
    option (google.api.http) = {
      delete: "/api/keypoints/{id}"
    };
  }

  rpc GetKeyPointsByUser (GetKeyPointsByUserRequest) returns (GetKeyPointsByUserResponse) {
    option (google.api.http) = {
      get: "/api/keypoints/user/{userId}"
    };
  }

  rpc GetKeyPointById (GetKeyPointByIdRequest) returns (KeyPoint) {
    option (google.api.http) = {
      get: "/api/keypoints/{id}"
    };
  }
}

// =================== Messages ===================

// Tour
message Tour {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string difficulty = 4;
  repeated string tags = 5;
  string status = 6;
  double price = 7;
  int64 userId = 8;
  double lengthInKm = 9;
  string publishedTime = 10;
  string archiveTime = 11;
}

message AddTourRequest {
  string name = 1;
  string description = 2;
  string difficulty = 3;
  repeated string tags = 4;
  string status = 5;
  double price = 6;
  int64 userId = 7;
  double lengthInKm = 8;
  string publishedTime = 9;
  string archiveTime = 10;
}

message GetToursByUserRequest {
  int64 userId = 1;
}

message GetToursByUserResponse {
  repeated Tour tours = 1;
}

// KeyPoint
message KeyPoint {
  int64 id = 1;
  string name = 2;
  double longitude = 3;
  double latitude = 4;
  string description = 5;
  string image = 6;
  string imageBase64 = 7;
  int64 tourId = 8;
  int32 publicStatus = 9;
}

message AddKeyPointRequest {
  string name = 1;
  double longitude = 2;
  double latitude = 3;
  string description = 4;
  string imageBase64 = 5;
  int64 tourId = 6;
  int32 publicStatus = 7;
}

message DeleteKeyPointRequest {
  int64 id = 1;
}

message DeleteKeyPointResponse {
  bool success = 1;
}

message GetKeyPointsByUserRequest {
  int64 userId = 1;
}

message GetKeyPointsByUserResponse {
  repeated KeyPoint keyPoints = 1;
}

message GetKeyPointByIdRequest {
  int64 id = 1;
}
