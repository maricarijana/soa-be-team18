syntax = "proto3";
option go_package = "proto/stakeholders";

option csharp_namespace = "GrpcServiceTranscoding";
import "google/api/annotations.proto";

package stakeholders;

service StakeholdersService {
	rpc Register (AccountRegistration) returns (User) {
    option (google.api.http) = {
      post: "/api/user/register"
      body: "*"
    };
  }

  rpc GetAllAccounts (PagedRequest) returns (AccountList) {
    option (google.api.http) = {
      get: "/api/administration/account"
    };
  }

  rpc Login (Credentials) returns (AuthenticationTokens) {
    option (google.api.http) = {
      post: "/api/users/login"
      body: "*"
    };
  }

  rpc BlockUser (BlockRequest) returns (Account) {
    option (google.api.http) = {
      put: "/api/administration/account/block/{accountId}"
      body: "*"
    };
  }
  rpc GetPerson (PersonRequest) returns (Person) {
    option (google.api.http) = {
      get: "/api/person/{id}"
    };
  }

  rpc UpdatePerson (PersonUpdateRequest) returns (Person) {
    option (google.api.http) = {
      put: "/api/person/{id}"
      body: "*"
    };
  }
  rpc GetPersonByUserId (PersonByUserIdRequest) returns (Person) {
  option (google.api.http) = {
    get: "/api/person/user/{userId}"
  };
}
}

// The request message containing the user's name.
message PagedRequest {
  int32 page = 1;
  int32 pageSize = 2;
}

message AccountList {
  repeated Account accounts = 1;
}

message Account {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  bool isActive = 5;
}

message AccountRegistration {
  string username = 1;
  string password = 2;
  string email = 3;
  string name = 4;
  string surname = 5;
  string profilePicture = 6;
  string biography = 7;
  string motto = 8;
  double wallet = 9;
  string imageBase64 = 10;
  string role = 11;
}

message User {
  int32 id = 1;
  string username = 2;
  bool isActive = 3;
}

message BlockRequest {
  int64 accountId = 1;
}

message Credentials {
  string username = 1;
  string password = 2;
}

message AuthenticationTokens {
  string accessToken = 1;
  string refreshToken = 2;
}
message PersonRequest {
  int64 id = 1;
  string role = 2;
}

message PersonUpdateRequest {
  int32 id = 1;
  int64 userId = 2;
  string name = 3;
  string surname = 4;
  string email = 5;
  string biography = 6;
  string motto = 7;
  string imageBase64 = 8;
  string imageUrl = 9;
}


message Person {
  int32 id = 1;
  int64 userId = 2;
  string name = 3;
  string surname = 4;
  string email = 5;
  string biography = 6;
  string motto = 7;
  string imageUrl = 8;
}

message PersonByUserIdRequest {
  int64 userId = 1;
}

